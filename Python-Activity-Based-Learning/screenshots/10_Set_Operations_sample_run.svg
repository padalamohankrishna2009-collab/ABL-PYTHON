<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380"><rect width="100%" height="100%" rx="16" fill="#101820"/><rect width="100%" height="48" rx="16" fill="#263746"/><circle cx="24" cy="24" r="7" fill="#ff6b6b"/><circle cx="46" cy="24" r="7" fill="#ffd166"/><circle cx="68" cy="24" r="7" fill="#06d6a0"/><text x="95" y="30" fill="#e9f1f7" font-family="Arial" font-size="16">Python sample run — Set Operations</text><text x="30" y="82" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">$ python main.py</text><text x="30" y="110" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">Enter integers for set A, separated by spaces: 1 2 3</text><text x="30" y="138" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">Enter integers for set B, separated by spaces: 3 4 5</text><text x="30" y="166" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">Set A: {1, 2, 3}</text><text x="30" y="194" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">Set B: {3, 4, 5}</text><text x="30" y="222" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">Union: {1, 2, 3, 4, 5}</text><text x="30" y="250" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">Intersection: {3}</text><text x="30" y="278" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">A - B: {1, 2}</text><text x="30" y="306" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">Enter a number to search in set A: 2</text><text x="30" y="334" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">2 is present in set A.</text></svg>