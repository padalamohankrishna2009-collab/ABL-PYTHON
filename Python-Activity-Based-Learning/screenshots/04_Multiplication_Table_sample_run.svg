<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436"><rect width="100%" height="100%" rx="16" fill="#101820"/><rect width="100%" height="48" rx="16" fill="#263746"/><circle cx="24" cy="24" r="7" fill="#ff6b6b"/><circle cx="46" cy="24" r="7" fill="#ffd166"/><circle cx="68" cy="24" r="7" fill="#06d6a0"/><text x="95" y="30" fill="#e9f1f7" font-family="Arial" font-size="16">Python sample run — Multiplication Table</text><text x="30" y="82" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">$ python main.py</text><text x="30" y="110" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">Enter a number: 5</text><text x="30" y="138" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 1 = 5</text><text x="30" y="166" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 2 = 10</text><text x="30" y="194" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 3 = 15</text><text x="30" y="222" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 4 = 20</text><text x="30" y="250" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 5 = 25</text><text x="30" y="278" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 6 = 30</text><text x="30" y="306" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 7 = 35</text><text x="30" y="334" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 8 = 40</text><text x="30" y="362" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 9 = 45</text><text x="30" y="390" fill="#d9e7ef" font-family="Consolas,Menlo,monospace" font-size="17">5 x 10 = 50</text></svg>